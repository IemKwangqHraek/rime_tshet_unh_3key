name: Verify scheme

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build:rime
      - name: Verify pinned upstream sources and fanqie results
        if: matrix.node == 24
        run: |
          npm run fetch:sources
          npm run audit:fanqie
      - name: Ensure checks leave tracked files unchanged
        run: git diff --exit-code
